[tools]
node = "24.20.0"
pnpm = "11.25.0"
# FFmpeg is a hard runtime requirement now, not a convenience: HyperFrames shells out to
# ffmpeg for source-frame extraction and to ffprobe for media duration, and the render
# fails without them. Remotion used to ship its own binary, so this is new.
ffmpeg = "latest"

[env]
# Keep the VOICEVOX endpoint in one place; scripts/lib/voicevox.ts reads VOICEVOX_URL
# and scripts/voicevox-engine.sh reads VOICEVOX_PORT.
VOICEVOX_PORT = "50021"
VOICEVOX_URL = "http://127.0.0.1:50021"
